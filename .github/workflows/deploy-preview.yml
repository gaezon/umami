name: Deploy to Vercel Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

env:
  VERCEL_CLI_VERSION: 59.1.3

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Vercel deployment credentials
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Prepare source without Git metadata
        run: |
          rm -rf "$RUNNER_TEMP/umami-vercel-preview"
          mkdir -p "$RUNNER_TEMP/umami-vercel-preview"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/umami-vercel-preview"
          cp .gitignore "$RUNNER_TEMP/umami-vercel-preview/.biomeignore"

      - name: Deploy Preview
        id: vercel-deploy
        run: |
          cd "$RUNNER_TEMP/umami-vercel-preview"
          deployment_url="$(env -u GITHUB_ACTIONS -u GITHUB_SHA -u GITHUB_REF -u GITHUB_REF_NAME -u GITHUB_HEAD_REF -u GITHUB_BASE_REF -u GITHUB_REPOSITORY npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --yes --token="$VERCEL_TOKEN")"
          test -n "$deployment_url"
          printf 'preview_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.vercel-deploy.outputs.preview_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const issueNumber = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const body = `<!-- vercel-preview -->\n🚀 **Vercel Preview Deployed**\n\n[Open Preview](${previewUrl})`;
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes('<!-- vercel-preview -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }
