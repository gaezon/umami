name: Deploy to Vercel Production

on:
  workflow_run:
    workflows:
      - Node.js CI
    types:
      - completed
  workflow_dispatch:

env:
  VERCEL_CLI_VERSION: 59.1.3

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify Vercel deployment credentials
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Prepare source without Git metadata
        run: |
          rm -rf "$RUNNER_TEMP/umami-vercel-production"
          mkdir -p "$RUNNER_TEMP/umami-vercel-production"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/umami-vercel-production"

      - name: Deploy Production
        run: |
          cd "$RUNNER_TEMP/umami-vercel-production"
          env -u GITHUB_ACTIONS -u GITHUB_SHA -u GITHUB_REF -u GITHUB_REF_NAME -u GITHUB_HEAD_REF -u GITHUB_BASE_REF -u GITHUB_REPOSITORY npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --yes --prod --token="$VERCEL_TOKEN"
