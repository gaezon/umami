name: Sync upstream

on:
  schedule:
    - cron: '17 4 * * 0' # Runs every Sunday at 4:17 AM UTC.
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Set fetch-depth to 0 to fetch all history for all branches and tags.
          # This is necessary for merging histories.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/umami-software/umami.git || true
          git remote set-url upstream https://github.com/umami-software/umami.git

      - name: Fetch upstream changes
        run: |
          git fetch upstream
          git fetch origin

      - name: Check if merge is needed
        id: check-merge
        run: |
          git checkout -B migration-base origin/master
          UPSTREAM_COMMITS=$(git rev-list --count origin/master..upstream/master)
          echo "upstream-commits=$UPSTREAM_COMMITS" >> $GITHUB_OUTPUT
          if [ "${UPSTREAM_COMMITS:-0}" -eq 0 ]; then
            echo "no-merge-needed=true" >> $GITHUB_OUTPUT
            echo "No new commits to merge"
          else
            echo "no-merge-needed=false" >> $GITHUB_OUTPUT
            echo "Found $UPSTREAM_COMMITS new commits to merge"
          fi

      - name: Merge upstream changes
        id: merge
        if: steps.check-merge.outputs.no-merge-needed == 'false'
        run: |
          set -euo pipefail

          branch="sync/upstream-${{ github.run_id }}"
          git checkout -B "$branch" origin/master

          # Keep fork-local workflows unchanged to avoid push rejection for workflow updates.
          if ! git merge upstream/master --no-ff --no-edit --no-commit; then
            conflict_paths="$(git diff --name-only --diff-filter=U)"

            if [ -z "$conflict_paths" ]; then
              echo "Merge failed without file conflicts; aborting merge" >&2
              git merge --abort || true
              exit 1
            fi

            non_workflow_conflicts="$(printf '%s\n' "$conflict_paths" | grep -v '^\.github/workflows/' || true)"
            if [ -n "$non_workflow_conflicts" ]; then
              echo "::error::Unresolved non-workflow merge conflicts:" >&2
              printf ' - %s\n' "$non_workflow_conflicts" >&2
              git merge --abort
              exit 1
            fi

            echo "Resolving fork-local workflow conflicts by keeping the current fork versions:"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              echo " - $path"
              git checkout --ours -- "$path"
              git add -- "$path"
            done <<< "$conflict_paths"
          fi

          # Drop upstream changes to workflow files before committing.
          workflow_changes="$(git diff --name-only --cached -- '.github/workflows/*' || true)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              git restore --source=HEAD --staged --worktree -- "$path"
            else
              git rm -f -- "$path"
            fi
          done <<< "$workflow_changes"

          # Always record the upstream commit as a merge, even when upstream only
          # changed workflow files that are intentionally kept fork-local.
          git commit --no-edit --allow-empty
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push sync branch and open PR
        if: steps.check-merge.outputs.no-merge-needed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          set -euo pipefail

          git push --force-with-lease origin "$BRANCH"

          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            pr_url="$({
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base master \
                --head "$BRANCH" \
                --title "chore: sync upstream/master" \
                --body "Automated upstream sync. Review and approve the workflow-created CI runs before merge."
            })"
          fi

          gh pr merge "$pr_url" --merge --auto --delete-branch

      - name: Report sync PR
        if: steps.check-merge.outputs.no-merge-needed == 'false'
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          echo "Opened or updated sync PR for $BRANCH"
