name: Sync upstream

on:
  schedule:
    - cron: '17 4 * * *' # Runs every day at 4:17 AM UTC.
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Set fetch-depth to 0 to fetch all history for all branches and tags.
          # This is necessary for merging histories.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/umami-software/umami.git || true
          git remote set-url upstream https://github.com/umami-software/umami.git

      - name: Fetch upstream changes
        run: |
          git fetch upstream
          git fetch origin

      - name: Check if merge is needed
        id: check-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/sync-upstream.sh check

      - name: Merge upstream changes
        id: merge
        if: steps.check-merge.outputs.no-merge-needed == 'false'
        env:
          LAST_SYNCED: ${{ steps.check-merge.outputs.last-synced }}
          CURRENT_UPSTREAM: ${{ steps.check-merge.outputs.current-upstream }}
          UPSTREAM_COMMITS: ${{ steps.check-merge.outputs.upstream-commits }}
        run: bash .github/scripts/sync-upstream.sh merge

      - name: Push sync branch and open PR
        if: steps.check-merge.outputs.no-merge-needed == 'false' && steps.merge.outputs.has-changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          set -euo pipefail

          git push --force-with-lease origin "$BRANCH"

          title="chore: sync upstream/master"
          if [ "${{ steps.check-merge.outputs.upstream-commits }}" = "0" ]; then
            title="ci: unify git history with upstream checkpoint"
          fi

          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            pr_url="$({
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base master \
                --head "$BRANCH" \
                --title "$title" \
                --body "Automated upstream sync. The sync/upstream branch is bot-owned and regenerated from master; do not commit directly to it. Review the upstream changes and workflow-created CI runs, then use Create a merge commit (do not squash or rebase) to merge this PR manually. Squash would drop the upstream parent and force the next run to re-unify history."
            })"
          fi

      - name: Report sync PR
        if: steps.check-merge.outputs.no-merge-needed == 'false' && steps.merge.outputs.has-changes == 'true'
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          echo "Opened or updated sync PR for $BRANCH"
