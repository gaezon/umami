name: Sync upstream

on:
  schedule:
    - cron: '17 4 * * *' # Check daily for a new stable upstream release.
  workflow_dispatch:

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/umami-software/umami.git || true
          git remote set-url upstream https://github.com/umami-software/umami.git

      - name: Fetch upstream releases
        run: |
          git fetch upstream --tags
          git fetch origin

      - name: Check for a new stable release
        id: check-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/sync-upstream.sh check

      - name: Merge the release
        id: merge
        if: steps.check-merge.outputs.no-merge-needed == 'false'
        env:
          LAST_SYNCED: ${{ steps.check-merge.outputs.last-synced }}
          CURRENT_UPSTREAM: ${{ steps.check-merge.outputs.release-sha }}
          RELEASE_TAG: ${{ steps.check-merge.outputs.release-tag }}
          UPSTREAM_COMMITS: ${{ steps.check-merge.outputs.upstream-commits }}
        run: bash .github/scripts/sync-upstream.sh merge

      - name: Open an issue when the upgrade needs a human
        id: notify
        if: steps.merge.outputs.needs-manual == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.check-merge.outputs.release-tag }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: bash .github/scripts/sync-upstream.sh notify

      - name: Fail once so the conflict is visible
        if: steps.merge.outputs.needs-manual == 'true' && steps.notify.outputs.already-reported == 'false'
        run: |
          echo "::error::Upstream ${{ steps.check-merge.outputs.release-tag }} needs a manual upgrade. See the issue opened by this job."
          exit 1

      - name: Push branch, open PR, and auto-merge if checks pass
        if: steps.check-merge.outputs.no-merge-needed == 'false' && steps.merge.outputs.has-changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          RELEASE_TAG: ${{ steps.check-merge.outputs.release-tag }}
        run: |
          set -euo pipefail

          git push --force-with-lease origin "$BRANCH"

          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base master \
              --head "$BRANCH" \
              --title "chore: upgrade umami to ${RELEASE_TAG}" \
              --body "Automated upgrade to stable upstream [${RELEASE_TAG}](https://github.com/umami-software/umami/releases/tag/${RELEASE_TAG}). Bot-owned branch; CI green will auto-merge as a merge commit (do not squash).")"
          fi

          gh pr merge "$pr_url" --merge --auto
          echo "Queued auto-merge for $pr_url"
